[project]
name = "vnhlfl-pipeline"
version = "0.1.0"
description = "Turns the VNHLFL founder's spreadsheets into the JSON the site reads"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vnhlfl_pipeline"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["vnhlfl_pipeline", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
