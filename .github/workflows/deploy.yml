name: Deploy to GitHub Pages

# The site is static: the committed JSON in web/public/data is the content, so every push to
# main that touches the web (code or data) publishes it.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # Served from https://<owner>.github.io/<repo>/ until a custom domain is set; then use `/`.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA rewrite: its 404 page is the app shell, so deep links still boot.
      - run: cp dist/vnhlfl/browser/index.html dist/vnhlfl/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/vnhlfl/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
